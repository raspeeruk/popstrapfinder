name: Daily news scrape

on:
  schedule:
    # Daily at 06:17 UTC — avoids the cron-hour stampede on shared infra.
    - cron: '17 6 * * *'
  workflow_dispatch: # allow manual runs from the Actions tab

permissions:
  contents: write

concurrency:
  group: scrape-news
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run scraper
        run: node scripts/scrape-news.mjs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/data/discovered-news.json
          if git diff --staged --quiet; then
            echo "No new findings — nothing to commit."
          else
            git commit -m "chore: daily news scrape $(date -u +%Y-%m-%d)"
            git push
          fi
