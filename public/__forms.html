<!doctype html>
<html>
  <head><title>Forms</title></head>
  <body>
    <!--
      Static forms for Netlify's HTML post-processor to detect at build time.
      Real forms submit via JS fetch to "/" with the matching form-name.
    -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="subject" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>
    <form name="originals-waitlist" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="email" name="email" />
      <input type="text" name="favorite_colorway" />
      <input type="text" name="strap_type" />
      <input type="text" name="strap_notes" />
      <input type="text" name="bot-field" />
    </form>
  </body>
</html>
